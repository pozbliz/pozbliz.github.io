name: "Build and Deploy"

on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test agent-readable output
        run: python tests/test_agent_readiness.py _site

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify public endpoints
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify agent-readable endpoints
        env:
          SITE_URL: https://www.sebastianrotter.de
        run: |
          set -euo pipefail
          cache_bust="${GITHUB_SHA}"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          curl --fail --silent --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "$SITE_URL/?verify=$cache_bust" > "$work_dir/home.html"
          grep -Eq '"@type"[[:space:]]*:[[:space:]]*"Person"' "$work_dir/home.html"
          grep -Eq '"@type"[[:space:]]*:[[:space:]]*"Organization"' "$work_dir/home.html"

          curl --fail --silent --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "$SITE_URL/llms.txt?verify=$cache_bust" > "$work_dir/llms.txt"
          grep -q "## When to use this site" "$work_dir/llms.txt"
          grep -q "## How agents should use this site" "$work_dir/llms.txt"

          curl --fail --silent --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "$SITE_URL/sitemap.xml?verify=$cache_bust" > "$work_dir/sitemap.xml"
          grep -q '<urlset' "$work_dir/sitemap.xml"

          status="$(curl --silent --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 3 \
            --output "$work_dir/404.html" --write-out '%{http_code}' \
            "$SITE_URL/agent-readiness-missing-page-$cache_bust")"
          test "$status" = "404"
          grep -q 'href="/llms.txt"' "$work_dir/404.html"
          grep -q 'href="/sitemap.xml"' "$work_dir/404.html"
